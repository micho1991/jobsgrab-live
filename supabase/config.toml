# Local development config for the Supabase CLI (`supabase start`).
# Hosted projects: mirror these settings in the Supabase Dashboard (see README).
project_id = "hr-recruit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "hrrecruit://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_WEB_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
# Required for native Google Sign-In on iOS (ID token without nonce)
skip_nonce_check = true

[functions.send-emails]
verify_jwt = false

[functions.process-deletion]
verify_jwt = true

[functions.maintenance]
verify_jwt = false
