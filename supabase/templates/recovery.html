<!-- Supabase Auth: "Reset password" template. Paste into Dashboard → Auth → Email Templates. -->
<div style="font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;max-width:560px;margin:0 auto;color:#1F2937">
  <div style="background:#0B1F3A;color:#fff;padding:20px 28px;border-radius:12px 12px 0 0;font-weight:700">Careers Portal</div>
  <div style="border:1px solid #E5E7EB;border-top:0;border-radius:0 0 12px 12px;padding:28px">
    <h1 style="font-size:20px;color:#0B1F3A;margin:0 0 16px">Reset your password</h1>
    <p style="font-size:15px;line-height:1.6">We received a request to reset your password. This link expires in 1 hour.</p>
    <p style="margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
         style="background:#0B1F3A;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600">Choose a new password</a>
    </p>
    <p style="font-size:12px;color:#6B7280">If you didn't request this, you can ignore this email; your password won't change.</p>
  </div>
</div>
